<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ARCHITECT v43.3 - Terminal d'Intelligence PMU Élite. Analyse prédictive et gestion de capital professionnelle.">
    <meta name="theme-color" content="#0a0f14">
    <title>ARCHITECT | Intelligence PMU Élite</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=43.3.1">
    
    <link rel="stylesheet" href="/css/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-shell">
        <!-- Sidebar Navigation Rail -->
        <nav class="nav-rail">
            <div class="brand">
                <h2>ARCHITECT</h2>
                <span>Terminal d'Intelligence</span>
            </div>

            <div class="nav-links">
                <a href="#" onclick="showPage('dashboard')" class="nav-item active" id="nav-dashboard">
                    <i class="fas fa-crown"></i>
                    <span>Quinté du Jour</span>
                </a>
                <a href="#" onclick="showPage('courses')" class="nav-item" id="nav-courses">
                    <i class="fas fa-microchip"></i>
                    <span>Scanner de Marché</span>
                </a>
                <a href="pepites.html" class="nav-item">
                    <i class="fas fa-gem"></i>
                    <span>Pépites IA</span>
                </a>
                <a href="palmares.html" class="nav-item">
                    <i class="fas fa-trophy"></i>
                    <span>Palmarès</span>
                </a>
                <a href="backtest.html" class="nav-item">
                    <i class="fas fa-vial"></i>
                    <span>Laboratoire</span>
                </a>
            </div>

            <div class="nav-footer">
                <div class="bankroll-card" style="margin-bottom: 12px; background: hsla(var(--h-indigo), 84%, 67%, 0.05); border-color: hsla(var(--h-indigo), 84%, 67%, 0.2);">
                    <label style="display: flex; justify-content: space-between; width: 100%;">Win Rate (7j) <i class="fas fa-chart-line"></i></label>
                    <div class="amount" id="stat-winrate-display" style="color: var(--accent-indigo); font-size: 20px;">--%</div>
                </div>
                <div class="bankroll-card">
                    <label>Capital Actuel</label>
                    <div class="amount" id="stat-bankroll-display">0.00 €</div>
                </div>
                <div style="margin-top: 24px; font-size: 10px; color: var(--text-low); text-align: center; font-weight: 800; letter-spacing: 1px;">
                    SYSTÈME : <span style="color: var(--accent-emerald)">v44 OPÉRATIONNEL</span>
                </div>
            </div>
        </nav>

        <!-- Main Content Stage -->
        <main class="main-stage">
            <header class="stage-header">
                <div class="title-group">
                    <h1 id="stage-title">Moniteur de Performance</h1>
                    <div class="meta" id="current-date">
                        <span class="live-indicator"></span> INITIALISATION DU FLUX...
                    </div>
                </div>
                <div class="actions" style="display: flex; gap: 12px; align-items: center;">
                    <div style="display: flex; align-items: center; gap: 8px; background: hsla(0,0%,100%,0.05); border: 1px solid var(--glass-border); padding: 4px 12px; border-radius: 8px;">
                        <i class="fas fa-calendar-alt" style="color: var(--accent-gold); font-size: 14px;"></i>
                        <input type="date" id="calendar-filter" onchange="refreshData()" style="background: transparent; border: none; color: var(--text-pure); font-family: 'JetBrains Mono'; font-size: 13px; outline: none; cursor: pointer;">
                    </div>
                    <button onclick="syncHistoryPrompt()" class="nav-item" style="border: 1px solid var(--glass-border); padding: 10px 20px; font-size: 13px;">
                        <i class="fas fa-history"></i>
                        <span>Synchro. Étendue</span>
                    </button>
                    <button onclick="syncMarket()" class="nav-item" style="border: 1px solid var(--glass-border); padding: 10px 20px; font-size: 13px; background: hsla(var(--h-indigo), 84%, 67%, 0.1);">
                        <i class="fas fa-sync-alt"></i>
                        <span>Sync. Live</span>
                    </button>
                </div>
            </header>

            <div class="scroll-content">
                <!-- VIEW: DASHBOARD -->
                <div id="view-dashboard" class="view active">
                    <div id="quinte-container">
                        <!-- JS Skeleton Injection -->
                    </div>
                </div>

                <!-- VIEW: SCANNER -->
                <div id="view-courses" class="view">
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Heure</th>
                                    <th>Événement</th>
                                    <th>Contexte</th>
                                    <th>Top Vecteur</th>
                                    <th>Score IA</th>
                                    <th>Cote</th>
                                    <th>Allocation</th>
                                    <th>Statut</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="courses-table-body">
                                <!-- JS Skeleton Injection -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Details -->
    <div id="modal-details" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; backdrop-filter: blur(20px); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
        <div class="stat-card" style="width: 1400px; max-width: 95vw; max-height: 90vh; overflow-y: auto; border: 1px solid var(--accent-indigo);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                <h2 style="font-size: 24px; font-weight: 800; letter-spacing: -1px;">Analyse de Vecteurs IA</h2>
                <button onclick="closeModal()" style="background: hsla(0, 0%, 100%, 0.05); border: 1px solid var(--glass-border); color: var(--text-high); padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="js/app.js?v=elite.1.1"></script>
</body>

</html>
